<div id="toast-{{category}}"
  class="fixed top-16 left-0 right-0 m-auto z-50 flex items-center w-full max-w-2xl p-6 text-black shadow-xl border-2{% if category == 'success' %} bg-green-50  border-secondary {% elif category == 'danger' %} bg-red-200 border-red-500 {% endif %} bg-opacity-80"
  role="alert">
  <!-- prettier-ignore -->
  <!-- id="toast-{{category}}" -->
  {% if category == 'success' %}
  <div class="w-12 h-12 flex justify-center items-center rounded-full bg-green-400">
    <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-400 bg-white rounded-full">
      <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
        viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
        <path
          d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z" />
      </svg>
      <span class="sr-only">Check icon</span>
    </div>
  </div>
  <!-- prettier-ignore -->
  {% elif category == 'danger' %}
  <div class="w-12 h-12 flex justify-center items-center rounded-full bg-red-600">
    <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-red-600 bg-white rounded-full">
      <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" fill="currentColor">
        <path
          d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z" />
      </svg>
      <span class="sr-only">Error icon</span>
    </div>
  </div>
  <!-- prettier-ignore -->
  {% endif %}
  <div class="ml-3 text-sm font-normal">{{message}}</div>
  <!-- prettier-ignore -->
  <button type="button" hx-triger="click" hx-swap="delete" hx-target="#toast-{{category}}"
    hx-get="{{ url_for('main.no_content') }}"
    class="ml-auto -mx-1.5 -my-1.5  text-gray-900 hover:text-gray-900 focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-white inline-flex h-8 w-8 transition-colors duration-200"
    aria-label="Close">
    <span class="sr-only">Close</span>
    <!-- prettier-ignore -->
    <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd"
        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
        clip-rule="evenodd"></path>
    </svg>
  </button>
</div>
