apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: insight
data:
  pgbouncer.ini: |
    [databases]
    * = host=127.0.0.1 port=5433

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 2000
    default_pool_size = 50
    reserve_pool_size = 10
    reserve_pool_timeout = 5
    server_idle_timeout = 600
    ignore_startup_parameters = extra_float_digits
    log_connections = 0
    log_disconnections = 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: insight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      serviceAccountName: insight-sa
      initContainers:
        # Writes userlist.txt from env vars so credentials stay in Secrets.
        - name: write-userlist
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "\"$DB_USER\" \"$DB_PASSWORD\"" > /etc/pgbouncer/userlist.txt
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: insight-secrets
                  key: DB_USER         # adjust key name to match your Secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insight-secrets
                  key: DB_PASSWORD     # adjust key name to match your Secret
          volumeMounts:
            - name: pgbouncer-runtime
              mountPath: /etc/pgbouncer
      containers:
        - name: pgbouncer
          image: bitnami/pgbouncer:1
          ports:
            - containerPort: 5432
          env:
            - name: PGBOUNCER_AUTH_TYPE
              value: scram-sha-256
            - name: PGBOUNCER_IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /bitnami/pgbouncer/conf/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: pgbouncer-runtime
              mountPath: /etc/pgbouncer
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          args:
            - "--structured-logs"
            - "--address=127.0.0.1"
            - "--port=5433"    # avoids clash with PgBouncer's port 5432
            - "$(CLOUD_SQL_INSTANCE)"
          env:
            - name: CLOUD_SQL_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: insight-config
                  key: CLOUD_SQL_INSTANCE
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: insight
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
