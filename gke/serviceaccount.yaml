# Kubernetes service account linked to a GCP service account via Workload Identity.
# Pre-requisite: bind the GCP SA with the K8s SA using:
#   gcloud iam service-accounts add-iam-policy-binding \
#     insight-sa@PROJECT_ID.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:PROJECT_ID.svc.id.goog[insight/insight-sa]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insight-sa
  namespace: insight
  annotations:
    iam.gke.io/gcp-service-account: insight-sa@PROJECT_ID.iam.gserviceaccount.com
