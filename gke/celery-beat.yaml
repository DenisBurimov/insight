# StatefulSet keeps a single Beat instance and persists the celerybeat-schedule file.
# Only one replica is supported — running multiple beat instances causes duplicate tasks.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: celery-beat
  namespace: insight
spec:
  serviceName: celery-beat
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      serviceAccountName: insight-sa
      containers:
        - name: celery-beat
          image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPO/insight:latest
          command:
            - celery
            - -A
            - app.celery
            - beat
            - --loglevel=info
            - --schedule=/beat-data/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: insight-config
            - secretRef:
                name: insight-secrets
          volumeMounts:
            - name: beat-data
              mountPath: /beat-data
            - name: gmail-token
              mountPath: /secrets/token.pickle
              subPath: token.pickle
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: gmail-token
          secret:
            secretName: gmail-token
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: beat-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard-rwo
