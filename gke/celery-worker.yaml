apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      serviceAccountName: insight-sa
      containers:
        - name: celery-worker
          image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPO/insight:latest
          command: ["celery", "-A", "app.celery", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: insight-config
            - secretRef:
                name: insight-secrets
          volumeMounts:
            - name: gmail-token
              mountPath: /secrets/token.pickle
              subPath: token.pickle
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: gmail-token
          secret:
            secretName: gmail-token
            optional: true
