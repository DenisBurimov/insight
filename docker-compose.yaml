services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    restart: always
    command: ["--structured-logs", "--address=0.0.0.0", "--port=5432", "${CLOUD_SQL_INSTANCE}"]
    # On a GCE VM the metadata server provides credentials automatically.
    # Elsewhere mount a service account key:
    #   volumes:
    #     - ./sa-key.json:/sa-key.json:ro
    #   environment:
    #     GOOGLE_APPLICATION_CREDENTIALS: /sa-key.json
    expose:
      - "5432"

  pgbouncer:
    image: bitnami/pgbouncer:1
    restart: always
    environment:
      POSTGRESQL_HOST: cloud-sql-proxy
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${DB_USER}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    expose:
      - "5432"
    depends_on:
      - cloud-sql-proxy

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: sh ./start_web.sh
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8080:8080"
    expose:
      - "8080"
    volumes:
      - app_data:/home/app/app/static/payments
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kub.rule=Host(`your-domain.com`)"
      - "traefik.http.services.kub.loadbalancer.server.port=8080"
      - "traefik.http.routers.kub.tls=true"
      - "traefik.http.routers.kub.tls.certresolver=resolver"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: sh ./start_api.sh
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      PGBOUNCER_HOST: pgbouncer
    ports:
      - "8001:8001"
    expose:
      - "8001"
    depends_on:
      - app
      - pgbouncer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`your-domain.com`) && (PathPrefix(`/mcp`) || PathPrefix(`/routes`))"
      - "traefik.http.services.api.loadbalancer.server.port=8001"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=resolver"

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.celery worker --loglevel=info
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./token.pickle:/home/app/token.pickle:ro
    depends_on:
      - redis

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.celery beat --loglevel=info
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./token.pickle:/home/app/token.pickle:ro
      - celery_beat_data:/home/app
    depends_on:
      - redis

volumes:
  redis_data:
  app_data:
  celery_beat_data:
