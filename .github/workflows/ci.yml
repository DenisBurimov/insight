name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy pytest-env

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --ignore-missing-imports api/ tests/

      - name: Test
        run: pytest
        env:
          APP_ENV: testing
          SCHEDULER_ACCESS_TOKEN: ci-token
          IS_2FA_ENABLED: "false"
